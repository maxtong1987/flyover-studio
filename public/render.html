<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flyover Studio — Headless Renderer</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.10.0/dist/maplibre-gl.css"
    crossorigin="anonymous"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.10.0/dist/maplibre-gl.js"
    crossorigin="anonymous"
  ></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #07090e;
      overflow: hidden;
    }
    #map-stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: #07090e;
    }
    .maplibregl-ctrl-logo,
    .maplibregl-ctrl-attrib {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="map-stage"></div>
  <script type="module" src="js/headless-runner.mjs"></script>
</body>
</html>
